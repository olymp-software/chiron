name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v2.17.0
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  # Builds the Windows exes and lints the root package, which needs
  # frontend/dist for //go:embed.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build amd64
        run: wails build -platform windows/amd64 -webview2 download -o chiron-windows-amd64.exe
      - name: Build arm64
        run: wails build -platform windows/arm64 -webview2 download -o chiron-windows-arm64.exe
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./...
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: chiron-windows
          path: |
            build/bin/chiron-windows-amd64.exe
            build/bin/chiron-windows-arm64.exe
          if-no-files-found: error

  # Internal packages only: Linux and macOS need no WebKitGTK or cgo setup,
  # and build-tagged files are linted on their own OS.
  go-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./internal/...
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./internal/...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
